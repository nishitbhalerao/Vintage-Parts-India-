[build]
  command = "cd client && npm install && npm run build"
  publish = "client/dist"

[dev]
  command = "cd client && npm run dev"
  port = 3000

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "cd client && npm install && npm run build"
  publish = "client/dist"

[context.deploy-preview]
  command = "cd client && npm install && npm run build"
  publish = "client/dist"

[context.branch-deploy]
  command = "cd client && npm install && npm run build"
  publish = "client/dist"

# Environment variables for production
[env]
  VITE_API_URL = "https://your-backend-api.com/api"